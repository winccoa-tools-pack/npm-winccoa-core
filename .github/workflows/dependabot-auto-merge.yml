name: Dependabot Auto-merge

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  dependabot-auto-merge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: winccoa-tools-pack/.github/.github/workflows/reusable-dependabot-auto-merge.yml@main
    with:
      pr_url: ${{ github.event.pull_request.html_url }}
      merge_method: squash
      update_branch: true

  dependabot-refresh:
    if: github.event_name == 'push' && github.ref_name == 'develop'
    permissions:
      contents: write
      pull-requests: write
    # Temporary: points to the reusable workflow PR branch for validation.
    # After winccoa-tools-pack/.github#86 is merged, switch to @main.
    uses: winccoa-tools-pack/.github/.github/workflows/reusable-dependabot-refresh.yml@feature/reusable-dependabot-refresh
    with:
      base_branch: develop
      merge_method: squash
      update_branch: true
      enable_auto_merge: true
      update_branch: true
